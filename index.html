const epoch = Date.UTC(2026, 10, 12);
const dateLabel = document.getElementById("date");
let timer;
let currentPoem;
function showPoem(poem) {
  currentPoem = poem;
  const syllables = poem.pinyin.split(" ");
  let nextSyllable = 0;
  document.getElementById("verse").replaceChildren(...poem.lines.map(line => {
    const span = document.createElement("span");
    for (const character of line) {
      if (/\p{Script=Han}/u.test(character)) {
        const ruby = document.createElement("ruby");
        const reading = document.createElement("rt");
        reading.lang = "zh-Latn-pinyin";
        reading.textContent = syllables[nextSyllable++];
        ruby.append(character, reading);
        span.append(ruby);
      } else {
        span.append(character);
      }
    }
    return span;
  }));
  document.getElementById("title").textContent = "《" + poem.title + "》";
  document.getElementById("translation").textContent = poem.translation;
  document.getElementById("source").href = poem.source;
  document.getElementById("scene").textContent = poem.context;
  document.getElementById("card").open = false;
}
document.getElementById("shuffle").addEventListener("click", () => {
  const choices = poems.filter(poem => poem !== currentPoem);
  if (choices.length) showPoem(choices[Math.floor(Math.random() * choices.length)]);
});
function refresh() {
  const now = new Date();
  const day = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
  const key = new Date(day).toISOString().slice(0, 10);
  if (dateLabel.dateTime !== key) {
    const offset = (day - epoch) / 86400000;
    const poem = poems[((offset % poems.length) + poems.length) % poems.length];
    dateLabel.dateTime = key;
    dateLabel.textContent = now.toLocaleDateString("en", {month:"short", day:"numeric"});
    showPoem(poem);
  }
  const midnight = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
  clearTimeout(timer);
  timer = setTimeout(refresh, midnight - now);
}
refresh();
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
window.addEventListener("pageshow", refresh);
</script>
